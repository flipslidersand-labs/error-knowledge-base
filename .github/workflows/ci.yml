name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # pyproject を持たない repo なので install-command で依存を明示的に入れる。
  # NOTE: qa-workflows#2 マージ後に @main へ戻す（現在は検証のため feature ブランチ ref）。
  test:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/python-test.yml@feat/python-test-tierc-support
    with:
      install-command: "pip install -r requirements.txt pytest pytest-cov"
      coverage-threshold: 30
