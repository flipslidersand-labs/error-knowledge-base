name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  # peaceiris/actions-gh-pages は gh-pages ブランチへ push するため contents: write が必須。
  # pages/id-token は native actions/deploy-pages 用で本ワークフローでは未使用のため付与しない。
  contents: write

jobs:
  build-and-deploy:
    # peaceiris/actions-gh-pages は $HOME に認証トークン入りの作業コピーを残すため、
    # 常駐 self-hosted runner では使わない。GitHub ホスト runner(VM ごと破棄)に固定する(#171)。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build HTML from Markdown
        run: python scripts/build.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
